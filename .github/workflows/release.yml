name: 🚀 DayPass Release

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages-deploy-release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ow_version: ["24", "25"]
        arch: [
          "aarch64_cortex-a53", "aarch64_cortex-a72", "aarch64_cortex-a76",
          "aarch64_generic", "arm_cortex-a7_neon-vfpv4", "arm_cortex-a9_vfpv3-d16",
          "i386_pentium4", "mipsel_24kc", "x86_64"
        ]
      fail-fast: false
    steps:
      - name: 🔎 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate Release Version for Filenames
        run: echo "VERSION=v$(date +%y.%m.%d)" >> $GITHUB_ENV

      - name: 🦫 Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 🗓️ Restore / Save DayPass Downloads Cache
        uses: actions/cache@v4
        with:
          path: .cache/downloads/v${{ matrix.ow_version }}/${{ matrix.arch }}
          key: daypass-cache-release-v${{ matrix.ow_version }}-${{ matrix.arch }}-${{ hashFiles(format('config/architectures_{0}.json', matrix.ow_version)) }}
          restore-keys: |
            daypass-cache-release-v${{ matrix.ow_version }}-${{ matrix.arch }}-

      - name: 📥 Download Packages & Create Zip via Go Fetcher
        run: |
          go run .github/actions/fetch.go ${{ matrix.arch }} ${{ env.VERSION }} release ${{ matrix.ow_version }}

      - name: 📤 Upload Zip Artifact (For GitHub Releases)
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ matrix.ow_version }}-${{ matrix.arch }}
          path: DayPass_OW${{ matrix.ow_version }}_${{ matrix.arch }}_*.zip
          retention-days: 1

      - name: 📤 Upload Raw Packages Artifact (For CDN 'packages' Branch)
        uses: actions/upload-artifact@v4
        with:
          name: raw-release-v${{ matrix.ow_version }}-${{ matrix.arch }}
          path: matrix-download/v${{ matrix.ow_version }}/${{ matrix.arch }}
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate Release Version
        run: echo "VERSION=v$(date +%y.%m.%d)" >> $GITHUB_ENV

      - name: 🦫 Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 🛠️ Install Core Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y bash jq coreutils findutils zip unzip

      - name: 📁 Prepare Workspace Tree
        run: |
          mkdir -p merged-release
          mkdir -p manifest-workspace
          mkdir -p build-artifacts
          mkdir -p packages-branch-content

      - name: 📥 Download All Zip Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: merged-release/
          merge-multiple: true

      - name: 📥 Download All Raw Packages Artifacts (For jsDeliver CDN)
        uses: actions/download-artifact@v4
        with:
          pattern: raw-release-*
          path: packages-branch-content/
          merge-multiple: false

      - name: 📂 Restructure Architecture Folders for CDN Tree
        run: |
          cd packages-branch-content
          for dir in raw-release-v*; do
            if [ -d "$dir" ]; then
              raw_name="${dir#raw-release-}"
              ver="${raw_name%%-*}"
              arch="${raw_name#*-}"
              
              mkdir -p "$ver"
              mv "$dir" "$ver/$arch"
              echo "✅ Restructured CDN Directory : 📂 $dir -> ⛏️ $ver/$arch"
            fi
          done

      - name: 🦫 Run Go Engine (Merger & Manifest Compiler)
        env:
          INPUT_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INPUT_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_VERSION: ${{ env.VERSION }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
          INPUT_ACTOR: ${{ github.actor }}
          INPUT_RELEASE_TYPE: "release"
          GITHUB_REPOSITORY: ${{ github.repository }}
          DAYPASS_OUTPUT_DIR: ${{ github.workspace }}/build-artifacts
        run: |
          cd .github/actions/engine/
          go run .

      - name: 📊 Verify Release Assets Size & Guardrail
        run: |
          echo "📁 Listing all files in build-artifacts with their sizes :"
          find build-artifacts/ -type f -exec ls -lh {} +
          echo "--------------------------------------------------------"
          echo "🚨 Checking for zero-byte files ..."
          if find build-artifacts/ -type f -empty | grep -q .; then
            echo "❌ Error : Zero-byte files detected in build-artifacts!"
            find build-artifacts/ -type f -empty
            exit 1
          fi
          echo "✅ All release assets passed health check successfully!"

      - name: 🚀 Create and Upload Stable Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG_NAME="${{ env.VERSION }}"
          RELEASE_TITLE="🚀 ${{ env.VERSION }}"

          echo "🚀 Creating release $TAG_NAME via GitHub CLI ..."

          # Delete tag if partially created in a failed attempt
          gh release delete "$TAG_NAME" -y --cleanup-tag 2>/dev/null || true

          cat <<EOF > release_notes.md
          ## 🚀 DayPass Production Release
          🔥 Stable, optimized and production-ready build!
          
          📅 **Date** : \`${{ env.VERSION }}\`
          ⚡ **Build Number** : \`${{ github.run_number }}\`

          ### 📦 Asset Naming Convention
          - \`DayPass_OW24_{arch}_${{ env.VERSION }}.zip\` : Packages compiled for OpenWrt 24.x series.
          - \`DayPass_OW25_{arch}_${{ env.VERSION }}.zip\` : Packages compiled for OpenWrt 25.x series.
          EOF

          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md

          rm -f release_notes.md

          mkdir -p release-files

          echo "📁 Collecting release assets ..."
          find merged-release -type f -name "*.zip" -exec cp -v {} release-files/ \;
          find build-artifacts -type f -name "*.sha256" -exec cp -v {} release-files/ \;

          echo "📦 Contents of release-files:"
          ls -lah release-files || true

          # Guardrail: refuse empty upload
          if [ -z "$(ls -A release-files 2>/dev/null)" ]; then
            echo "❌ Guardrail failed: no files found in release-files/"
            echo "---- merged-release tree ----"
            find merged-release -type f | head -n 100 || true
            echo "---- build-artifacts tree ----"
            find build-artifacts -type f | head -n 100 || true
            exit 1
          fi

          # Guardrail: refuse zero-byte assets
          if find release-files -type f -empty | grep -q .; then
            echo "❌ Guardrail failed: zero-byte files detected in release-files/"
            find release-files -type f -empty
            exit 1
          fi

          echo "📤 Uploading assets to GitHub Release ..."
          gh release upload "$TAG_NAME" release-files/* --clobber

          echo "✅ Release uploaded successfully!"
          
      - name: 🕵️‍♀️ Prepare GitHub Pages Assets for Release
        run: |
          mkdir -p github-pages-content
          cp -r build-artifacts/* github-pages-content/
          echo "✅ Prepared manifest structures for Pages root deployment!"

      - name: 🌐 Deploy Manifests to GitHub Pages Root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: github-pages-content
          target-folder: .
          branch: gh-pages
          clean: false
          single-commit: true

      - name: 🔧 Increase Git HTTP Buffer Size
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M

      - name: 🚀 Deploy Binary Packages to 'packages' Branch Root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages-branch-content
          branch: packages
          target-folder: .
          clean: false
          single-commit: true

      - name: 🧹 Purge jsDelivr Cache for Manifest & Packages
        run: |
          echo "🌐 Purging jsDelivr CDN cache for Release ..."
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/manifest.json" | jq .
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/v24/manifest.json" | jq .
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/v25/manifest.json" | jq .
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/install.sh" | jq .
          echo "✅ Release CDN cache purged successfully!"

      - name: 🧹 Delete Temporary Build Artifacts
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: |
            release-*
            raw-release-*