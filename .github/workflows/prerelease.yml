name: 🧪 DayPass Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ow_version: ["24", "25"]
        arch: [
          "aarch64_cortex-a53", "aarch64_cortex-a72", "aarch64_cortex-a76",
          "aarch64_generic", "arm_cortex-a7_neon-vfpv4", "arm_cortex-a9_vfpv3-d16",
          "i386_pentium4", "mipsel_24kc", "x86_64"
        ]
      fail-fast: false
    steps:
      - name: 🔎 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate Beta Version for Filenames
        run: echo "VERSION=$(date +%y.%m.%d)" >> $GITHUB_ENV

      - name: 🦫 Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 🗓️ Restore / Save DayPass Downloads Cache
        uses: actions/cache@v4
        with:
          path: .cache/downloads/v${{ matrix.ow_version }}/${{ matrix.arch }}
          key: daypass-cache-v${{ matrix.ow_version }}-${{ matrix.arch }}-${{ hashFiles(format('config/architectures_{0}.json', matrix.ow_version)) }}
          restore-keys: |
            daypass-cache-v${{ matrix.ow_version }}-${{ matrix.arch }}-

      - name: 📥 Download Packages & Create Zip via Go Fetcher
        run: |
          go run .github/actions/fetch.go ${{ matrix.arch }} ${{ env.VERSION }} beta ${{ matrix.ow_version }}

      - name: 📤 Upload Zip Artifact (For GitHub Releases)
        uses: actions/upload-artifact@v4
        with:
          name: beta-v${{ matrix.ow_version }}-${{ matrix.arch }}
          path: DayPass_OW${{ matrix.ow_version }}_${{ matrix.arch }}_*_beta.zip
          retention-days: 1

      - name: 📤 Upload Raw Packages Artifact (For CDN 'packages' Branch)
        uses: actions/upload-artifact@v4
        with:
          name: raw-beta-v${{ matrix.ow_version }}-${{ matrix.arch }}
          path: matrix-download/v${{ matrix.ow_version }}/${{ matrix.arch }}
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate Beta Version
        run: echo "VERSION=$(date +%y.%m.%d)" >> $GITHUB_ENV

      - name: 🦫 Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 🛠️ Install Core Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y bash jq coreutils findutils zip unzip

      - name: 📁 Prepare Workspace Tree
        run: |
          mkdir -p merged-beta
          mkdir -p manifest-workspace
          mkdir -p build-artifacts
          mkdir -p packages-branch-content

      - name: 📥 Download All Zip Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: merged-beta/
          merge-multiple: true

      - name: 📥 Download All Raw Packages Artifacts (For CDN)
        uses: actions/download-artifact@v4
        with:
          pattern: raw-beta-*
          path: packages-branch-content/
          merge-multiple: false

      - name: 📂 Restructure Architecture Folders for CDN Tree
        run: |
          cd packages-branch-content
          for dir in raw-beta-v*; do
            if [ -d "$dir" ]; then
              raw_name="${dir#raw-beta-}"
              ver="${raw_name%%-*}"
              arch="${raw_name#*-}"
              
              mkdir -p "$ver"
              mv "$dir" "$ver/$arch"
              echo "✅ Restructured CDN Directory : 📂 $dir -> ⛏️ $ver/$arch"
            fi
          done

      - name: 🦫 Run Go Engine (Merger & Manifest Compiler)
        env:
          INPUT_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INPUT_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_VERSION: ${{ env.VERSION }}
          INPUT_BUILD_NUMBER: ${{ github.run_number }}
          INPUT_ACTOR: ${{ github.actor }}
          INPUT_RELEASE_TYPE: "beta"
          GITHUB_REPOSITORY: ${{ github.repository }}
          DAYPASS_OUTPUT_DIR: ${{ github.workspace }}/build-artifacts
        run: |
          cd .github/actions/engine/
          go run .

      - name: 📊 Verify Release Assets Size & Guardrail (BEFORE DEPLOYMENT)
        run: |
          echo "📁 Listing all files in build-artifacts with their sizes : "
          find build-artifacts/ -type f -exec ls -lh {} +
          echo "--------------------------------------------------------"
          echo "🚨 Checking for zero-byte or invalid files ..."
          if find build-artifacts/ -type f -empty | grep -q .; then
            echo "❌ Error : Zero-byte files detected in build-artifacts!"
            find build-artifacts/ -type f -empty
            exit 1
          fi
          echo "✅ All release assets passed health check successfully!"

      
      - name: 🧪 Create and Upload Pre-Release Packages via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ env.VERSION }}-beta-${{ github.run_number }}"
          RELEASE_TITLE="🧪 v${{ env.VERSION }}"
          
          echo "🚀 Creating release $TAG_NAME via GitHub CLI ..."
          
          gh release delete "$TAG_NAME" -y --cleanup-tag 2>/dev/null || true

          cat <<EOF > release_notes.md
          ## 🧪 DayPass Beta Release
          📅 **Date** : \`v${{ env.VERSION }}\`
          🧪 **Build** : \`${{ github.run_number }}\`

          ### 📦 Asset Naming Convention
          - \`DayPass_OW24_{arch}_v${{ env.VERSION }}_beta.zip\` : Compiled for OpenWrt 24.x
          - \`DayPass_OW25_{arch}_v${{ env.VERSION }}_beta.zip\` : Compiled for OpenWrt 25.x
          EOF

          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --prerelease \
            --notes-file release_notes.md

          rm -f release_notes.md

          mkdir -p release-files
          cp merged-beta/*.zip release-files/ 2>/dev/null || true
          find build-artifacts/ -type f -name "*.sha256" -exec cp {} release-files/ \; 2>/dev/null || true

          echo "📤 Uploading assets to GitHub Release ..."
          gh release upload "$TAG_NAME" release-files/* --clobber
          
          echo "✅ Pre-release uploaded successfully via GitHub CLI!"

      - name: 🕵️‍♀️ Prepare GitHub Pages Assets
        run: |
          mkdir -p github-pages-content
          cp -r build-artifacts/* github-pages-content/
          echo "✅ Prepared manifest structures & install.sh for Pages deployment!"

      - name: 🌐 Deploy Manifests to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: github-pages-content  
          target-folder: beta             
          branch: gh-pages
          clean: false         
          single-commit: true

      - name: 🚀 Deploy Binary Packages to 'packages' Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages-branch-content
          branch: packages
          target-folder: beta
          clean: false
          single-commit: true

      - name: 🧹 Purge jsDelivr Cache for Manifests & Packages
        run: |
          echo "🌐 Purging jsDelivr CDN cache for Beta ..."
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/beta/manifest.json" | jq .
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/beta/v24/manifest.json" | jq .
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/beta/v25/manifest.json" | jq .
          curl -s "https://purge.jsdelivr.net/gh/Chamroosh98/DayPass@gh-pages/beta/install.sh" | jq .
          echo "✅ Beta CDN cache purged successfully!"

      - name: 🧹 Cleanup old beta releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: success()
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Delete Temporary Build Artifacts
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: |
            beta-*
            raw-beta-*